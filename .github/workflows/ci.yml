name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME || 'your-username' }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          pytest tests/ -v
      
      - name: Run training script
        run: |
          python training/train.py
      
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-artifact
          path: artifacts/model.pkl
          retention-days: 1

  build-and-push:
    needs: train-model
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, ml-service, user-service, notification-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download model artifact
        if: matrix.service == 'ml-service'
        uses: actions/download-artifact@v4
        with:
          name: model-artifact
          path: services/ml-service/artifacts/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: env.REGISTRY == 'docker.io'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Log in to Google Container Registry
        if: env.REGISTRY == 'gcr.io'
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-cloud-run:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Get service URLs
        id: get-urls
        run: |
          ML_URL=$(gcloud run services describe ml-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
          USER_URL=$(gcloud run services describe user-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
          NOTIF_URL=$(gcloud run services describe notification-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
          
          # If services don't exist, construct expected URLs
          if [ -z "$ML_URL" ]; then
            ML_URL="https://ml-service-$(echo ${{ secrets.GCP_PROJECT_ID }} | tr ':' '-')-${{ env.GCP_REGION }}.a.run.app"
          fi
          if [ -z "$USER_URL" ]; then
            USER_URL="https://user-service-$(echo ${{ secrets.GCP_PROJECT_ID }} | tr ':' '-')-${{ env.GCP_REGION }}.a.run.app"
          fi
          if [ -z "$NOTIF_URL" ]; then
            NOTIF_URL="https://notification-service-$(echo ${{ secrets.GCP_PROJECT_ID }} | tr ':' '-')-${{ env.GCP_REGION }}.a.run.app"
          fi
          
          echo "ML_SERVICE_URL=$ML_URL" >> $GITHUB_ENV
          echo "USER_SERVICE_URL=$USER_URL" >> $GITHUB_ENV
          echo "NOTIFICATION_SERVICE_URL=$NOTIF_URL" >> $GITHUB_ENV
      
      - name: Deploy ML Service to Cloud Run
        run: |
          gcloud run deploy ml-service \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ml-service:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "MODEL_PATH=/app/artifacts/model.pkl" \
            --port 8081 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --quiet || echo "ML Service deployment failed"
      
      - name: Deploy User Service to Cloud Run
        run: |
          gcloud run deploy user-service \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8082 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --quiet || echo "User Service deployment failed"
      
      - name: Deploy Notification Service to Cloud Run
        run: |
          gcloud run deploy notification-service \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/notification-service:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --port 8083 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --quiet || echo "Notification Service deployment failed"
      
      - name: Deploy API Gateway to Cloud Run
        run: |
          gcloud run deploy api-gateway \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:latest \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars "ML_SERVICE_URL=${{ env.ML_SERVICE_URL }},USER_SERVICE_URL=${{ env.USER_SERVICE_URL }},NOTIFICATION_SERVICE_URL=${{ env.NOTIFICATION_SERVICE_URL }}" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --quiet || echo "API Gateway deployment failed"
      
      - name: Display service URLs
        run: |
          echo "=== Deployment Summary ==="
          echo "API Gateway:"
          gcloud run services describe api-gateway --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "  Not deployed"
          echo "ML Service:"
          gcloud run services describe ml-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "  Not deployed"
          echo "User Service:"
          gcloud run services describe user-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "  Not deployed"
          echo "Notification Service:"
          gcloud run services describe notification-service --region ${{ env.GCP_REGION }} --format 'value(status.url)' 2>/dev/null || echo "  Not deployed"
